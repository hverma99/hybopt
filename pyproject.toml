[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybopt"
version = "0.1.0"
description = "Embed trained ReLU and tanh neural networks in optimization models and benchmark solution methods."
authors = [
    { name = "Brooke Soobrian" },
    { name = "Harshit Verma" },
    { name = "Zhe Li" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.15",
    "torch>=2.2",
    "pandas>=2.0",
    "joblib>=1.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
